<!DOCTYPE html>
<html>
<head>
    <title>Image and Iframe Example</title>
</head>
<body bgcolor="lightyellow">

    <h1 align="center">My Webpage</h1>
    <hr>

    <h2>Sample Image</h2>
    <img src="https://via.placeholder.com/300x200"
         alt="Sample Image"
         width="300"
         height="200">

    <hr>

    <h2>Embedded Webpage (Iframe)</h2>
    <iframe src="https://www.wikipedia.org"
            width="600"
            height="350"
            title="Wikipedia">
    </iframe>

    <hr>

    <p><b>Thank you for visiting!</b></p>

</body>
</html>
